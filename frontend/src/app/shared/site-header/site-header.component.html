<header class="topbar">
  <a class="brand" routerLink="/" aria-label="MADINTY, accueil">
    <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true" focusable="false">
      <path d="M11 1C5.5 1 1.5 5.2 1.5 10.4 1.5 17 11 27 11 27s9.5-10 9.5-16.6C20.5 5.2 16.5 1 11 1z" fill="#EA4335" />
      <circle cx="11" cy="10.4" r="3.6" fill="#fff" />
    </svg>
    <span>MADINTY</span>
  </a>

  <nav class="nav" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Carte</a>
    <a routerLink="/organismes" routerLinkActive="active">Organismes</a>
    <a routerLink="/comment-ca-marche" routerLinkActive="active">Comment ça marche</a>
    <a routerLink="/contact" routerLinkActive="active">Contact</a>
    @if (auth.user()?.role === 'organization') {
      <a routerLink="/organisme" routerLinkActive="active">Mon organisme</a>
    }
    @if (auth.user()?.role === 'team_lead') {
      <a routerLink="/terrain" routerLinkActive="active">Mes missions</a>
    }
  </nav>

  <div class="actions">
    @if (auth.user(); as user) {
      <div class="profile-wrap">
        <button
          type="button"
          class="avatar"
          aria-haspopup="menu"
          [attr.aria-expanded]="profileOpen()"
          [attr.aria-label]="'Profil de ' + user.fullName"
          (click)="toggleProfile($event)"
        >
          {{ initials(user.fullName) }}
        </button>
        @if (profileOpen()) {
          <div class="profile-menu" role="menu" (click)="$event.stopPropagation()">
            <div class="profile-id">
              <strong>{{ user.fullName }}</strong>
              <span>{{ user.email }}</span>
            </div>
            <button type="button" role="menuitem" class="logout" (click)="logout()">Se déconnecter</button>
          </div>
        }
      </div>
    } @else {
      <button type="button" class="btn btn-outline" (click)="openAuth('login')">Connexion</button>
      <button type="button" class="btn btn-primary" (click)="openAuth('register')">S’inscrire</button>
    }
  </div>
</header>
